[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obesity-risk"
version = "0.1.0"
description = "肥胖风险预测系统课程设计"
requires-python = ">=3.10,<3.11"
dependencies = [
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "plotly>=6.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.4,<2.0",
    "streamlit>=1.59,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
